# The two matrix rows have different purposes:
#
#   windows-latest (target)            Brunel's only supported platform
#                                      (docs/spec.md §2.2). This row is the
#                                      product gate: the Windows-only Job Object,
#                                      workspace identity, and PowerShell paths
#                                      only ever run here.
#
#   ubuntu-latest (portability-guard)  NOT a support target. It keeps the
#                                      platform-agnostic core packages
#                                      (internal/filetools, internal/safety,
#                                      internal/redact) free of leaked Windows
#                                      syscalls, keeps the //go:build !windows
#                                      stubs in sync, and exercises the
#                                      non-Windows atomic-write / lock paths. A
#                                      green ubuntu run does not mean Brunel
#                                      supports Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            role: target
          - os: ubuntu-latest
            role: portability-guard
    name: build-test (${{ matrix.os }} - ${{ matrix.role }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum yet (zero dependencies); avoids a spurious cache-restore warning

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -v ./...

      - name: Zero-CGO build
        run: go build ./...
        env:
          CGO_ENABLED: 0
